<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>MicroTube — Authentication</title>

    <script src="/shared/theme.js?v=2"></script>
    <link rel="stylesheet" href="/shared/base.css?v=4">
    <link rel="stylesheet" href="/shared/auth.css?v=2">
</head>

<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="/" data-port="8080">microtube</a>
            <nav class="header-actions" aria-label="Navigation">
                <a href="/" data-port="8080">Home</a>
                <a href="/" data-port="8082">Upload</a>
                <div class="theme-control">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="theme-auto" class="theme-auto" type="button" aria-label="Use system theme" aria-pressed="true">Auto</button>
                </div>
            </nav>
        </header>
        <main class="auth-page">
            <h1>Sign in / register</h1>
            <form method="post">
                <div class="field">
                    <label for="login">Username</label>

                    <input
                        id="login"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <div class="button-row">
                    <button
                        class="button button-primary"
                        type="submit"
                        value="login">
                        Sign in
                    </button>

                    <button
                        class="button"
                        type="submit"
                        value="register">
                        Register
                    </button>
                </div>
            </form>

            <p id="auth-message" class="message" role="status" aria-live="polite" hidden></p>
            <button id="logout" class="button" type="button" hidden>Sign out</button>
        </main>
    </div>

    <script>
        document.querySelectorAll("[data-port]").forEach(link => {
            const target = new URL("/", location.href);
            target.port = link.dataset.port;
            link.href = target.href;
        });

        async function hash(value) {
            const first = await crypto.subtle.digest(
                "SHA-256",
                new TextEncoder().encode(value)
            );

            const second = await crypto.subtle.digest("SHA-256", first);

            return Array.from(
                new Uint8Array(second),
                byte => byte.toString(16).padStart(2, "0")
            ).join("");
        }

        const form = document.querySelector("form");
        const message = document.getElementById("auth-message");
        const logout = document.getElementById("logout");
        let busy = false;

        function showMessage(text, error = false) {
            message.className = "message" + (error ? " error" : "");
            message.setAttribute("role", error ? "alert" : "status");
            message.setAttribute("aria-live", error ? "assertive" : "polite");
            message.textContent = text;
            message.hidden = !text;
        }

        function signedIn(value) {
            form.hidden = value;
            logout.hidden = !value;
            document.querySelector(".auth-page h1").textContent = value ? "Account" : "Sign in / register";
            document.getElementById("password").value = "";
        }

        function setBusy(value) {
            busy = value;
            form.setAttribute("aria-busy", String(value));
            for (const field of form.elements) field.disabled = value;
            logout.disabled = value;
        }

        async function request(action, options = {}) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch("/api/auth/" + action, {
                    ...options, credentials: "same-origin", cache: "no-store", signal: controller.signal
                });
                if (!response.ok) {
                    const errors = {
                        401: "Incorrect username or password.",
                        403: "Request rejected. Reload the page and try again.",
                        409: "This username is already taken.",
                        422: "Check your username and password."
                    };
                    const error = new Error(errors[response.status] || "Authentication service unavailable. Please try again.");
                    error.status = response.status;
                    throw error;
                }
                return response;
            } catch (error) {
                if (error.status) throw error;
                throw new Error("Could not reach the authentication service. Please try again.");
            } finally {
                clearTimeout(timeout);
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (busy) return;
            const action = event.submitter?.value || "login";

            if (!globalThis.crypto?.subtle) {
                showMessage("Sign in requires HTTPS or localhost.", true);
                return;
            }

            setBusy(true);
            showMessage(action === "register" ? "Creating account…" : "Signing in…");
            let created = false;
            try {
                const body = new URLSearchParams({
                    login_hash: await hash(document.getElementById("login").value),
                    password_hash: await hash(document.getElementById("password").value)
                });
                await request(action, {method: "POST", body});
                created = action === "register";
                try {
                    await request("me");
                } catch (error) {
                    if (error.status === 401) {
                        throw new Error("Could not confirm your session. Allow cookies and try signing in again.");
                    }
                    throw error;
                }
                signedIn(true);
                showMessage(action === "register" ? "Account created. You are signed in." : "You are signed in.");
                location.assign(document.querySelector('[data-port="8080"]').href);
            } catch (error) {
                showMessage((created ? "Account created. " : "") + error.message, true);
            } finally {
                setBusy(false);
            }
        });

        logout.addEventListener("click", async () => {
            if (busy) return;
            setBusy(true);
            try {
                await request("logout", {method: "POST"});
                signedIn(false);
                showMessage("You are signed out.");
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                setBusy(false);
            }
        });

        async function restoreSession() {
            setBusy(true);
            try {
                await request("me");
                signedIn(true);
                showMessage("You are signed in.");
            } catch (error) {
                signedIn(false);
                if (error.status !== 401) showMessage(error.message, true);
            } finally {
                setBusy(false);
            }
        }

        restoreSession();
    </script>
</body>
</html>
