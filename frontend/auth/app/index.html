<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>MicroTube — Authentication</title>

    <script src="/shared/theme.js?v=2"></script>
    <link rel="stylesheet" href="/shared/base.css?v=4">
    <link rel="stylesheet" href="/shared/auth.css">
</head>

<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="/" data-port="8080">microtube</a>
            <nav class="header-actions" aria-label="Navigation">
                <a href="/" data-port="8080">Home</a>
                <a href="/" data-port="8082">Upload</a>
                <div class="theme-control">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="theme-auto" class="theme-auto" type="button" aria-label="Use system theme" aria-pressed="true">Auto</button>
                </div>
            </nav>
        </header>
        <main class="auth-page">
            <h1>Sign in / register</h1>
            <form method="post">
                <div class="field">
                    <label for="login">Username</label>

                    <input
                        id="login"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <input type="hidden" name="login_hash">
                <input type="hidden" name="password_hash">

                <div class="button-row">
                    <button
                        class="button button-primary"
                        type="submit"
                        value="login">
                        Sign in
                    </button>

                    <button
                        class="button"
                        type="submit"
                        value="register">
                        Register
                    </button>
                </div>
            </form>

            <p id="auth-message" role="alert" hidden></p>
        </main>
    </div>

    <script>
        document.querySelectorAll("[data-port]").forEach(link => {
            const target = new URL("/", location.href);
            target.port = link.dataset.port;
            link.href = target.href;
        });

        async function hash(value) {
            const first = await crypto.subtle.digest(
                "SHA-256",
                new TextEncoder().encode(value)
            );

            const second = await crypto.subtle.digest("SHA-256", first);

            return Array.from(
                new Uint8Array(second),
                byte => byte.toString(16).padStart(2, "0")
            ).join("");
        }

        const form = document.querySelector("form");

        form.addEventListener("submit", async event => {
            event.preventDefault();

            if (!globalThis.crypto?.subtle) {
                const message = document.getElementById("auth-message");
                message.textContent = "Sign in requires HTTPS or localhost.";
                message.hidden = false;
                return;
            }

            form.elements.login_hash.value = await hash(
                document.getElementById("login").value
            );

            form.elements.password_hash.value = await hash(
                document.getElementById("password").value
            );

            const target = new URL(
                "/auth/" + (event.submitter?.value || "login"),
                location.href
            );

            target.port = "${AUTH_API_PORT}";
            form.action = target.href;
            form.submit();
        });
    </script>
</body>
</html>
