<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Upload a video — MicroTube</title>
    <script src="/shared/theme.js?v=2"></script>
    <link rel="stylesheet" href="/shared/base.css?v=4">
    <link rel="stylesheet" href="/shared/upload.css">
</head>
<body>
<div class="site-shell">
    <header class="site-header">
        <a class="brand" href="/" data-port="8080">microtube</a>
        <nav class="header-actions" aria-label="Navigation">
            <a href="/" data-port="8080">Home</a>
            <a href="/" data-port="8083">Account</a>
            <a href="/" data-port="8081">System status</a>
            <div class="theme-control">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="theme-auto" class="theme-auto" type="button" aria-label="Use system theme" aria-pressed="true">Auto</button>
            </div>
        </nav>
    </header>
    <main class="upload-main">
        <h1>Upload a video</h1>
        <p class="hint">Sign in to publish a video.</p>
        <form id="upload-form" method="post" enctype="multipart/form-data" action="/api/upload/upload">
            <div class="dropzone" id="dropzone">
                <button class="button" type="button" id="choose-file">Choose MP4</button>
                <span class="hint">or drop a file here</span>
                <input id="video-file" name="file" type="file" accept=".mp4,video/mp4" hidden>
                <div class="file-info" id="file-info" aria-live="polite" hidden></div>
                <video id="video-preview" class="preview" controls playsinline hidden></video>
            </div>
            <div class="field">
                <label for="title">Video title *</label>
                <input id="title" name="title" type="text" maxlength="200" required>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" maxlength="5000" rows="4"></textarea>
            </div>
            <div class="field">
                <label for="tags">Tags</label>
                <input id="tags" name="tags" type="text" aria-describedby="tags-help">
                <p class="hint" id="tags-help">Separate tags with spaces: nature mountains travel</p>
            </div>
            <div class="progress-wrap" id="progress-wrap" hidden>
                <label class="progress-label" for="progress-bar">
                    <span id="progress-text">Uploading...</span>
                    <span id="progress-percent">0%</span>
                </label>
                <progress id="progress-bar" max="100" value="0"></progress>
            </div>
            <div id="feedback" class="message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <div class="submit-row">
                <button class="button button-primary" id="submit-button" type="submit">Upload video</button>
            </div>
        </form>
    </main>
</div>
<script>
(() => {
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("video-file");
    const dropzone = document.getElementById("dropzone");
    const fileInfo = document.getElementById("file-info");
    const preview = document.getElementById("video-preview");
    const feedback = document.getElementById("feedback");
    const submitButton = document.getElementById("submit-button");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const progressPercent = document.getElementById("progress-percent");

    let previewUrl = null;

    function serviceURL(port) {
        const url = new URL("/", location.href);
        url.port = port;
        return url;
    }

    document.querySelectorAll("[data-port]").forEach(link => {
        link.href = serviceURL(link.dataset.port).href;
    });

    document.getElementById("choose-file").addEventListener("click", () => {
        fileInput.click();
    });

    function formatSize(bytes) {
        if (bytes < 1024 * 1024) {
            return `${(bytes / 1024).toFixed(1)} KB`;
        }

        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function showMessage(message, type = "error") {
        feedback.hidden = false;
        feedback.className = `message ${type}`;
        feedback.textContent = message;
    }

    function useFile(file) {
        if (!file) return;

        if (!file.name.toLowerCase().endsWith(".mp4")) {
            fileInput.value = "";
            fileInfo.hidden = true;
            preview.hidden = true;
            preview.removeAttribute("src");
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = null;
            showMessage("Please choose a video file with the .mp4 extension.");
            return;
        }

        fileInput.files = (() => {
            const transfer = new DataTransfer();
            transfer.items.add(file);
            return transfer.files;
        })();

        fileInfo.hidden = false;
        fileInfo.replaceChildren();

        const name = document.createElement("strong");
        name.textContent = file.name;

        const size = document.createElement("small");
        size.textContent = formatSize(file.size);

        fileInfo.append(name, size);

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);

        preview.src = previewUrl;
        preview.hidden = false;
        feedback.hidden = true;
    }

    fileInput.addEventListener("change", () => {
        useFile(fileInput.files[0]);
    });

    ["dragenter", "dragover"].forEach(name => {
        dropzone.addEventListener(name, event => {
            event.preventDefault();
            dropzone.classList.add("dragging");
        });
    });

    ["dragleave", "drop"].forEach(name => {
        dropzone.addEventListener(name, event => {
            event.preventDefault();
            dropzone.classList.remove("dragging");
        });
    });

    dropzone.addEventListener("drop", event => {
        const file = event.dataTransfer.files[0];
        useFile(file);
    });

    form.addEventListener("submit", event => {
        event.preventDefault();
        feedback.hidden = true;

        const file = fileInput.files[0];

        if (!file || !file.name.toLowerCase().endsWith(".mp4")) {
            showMessage("Choose an MP4 file first.");
            return;
        }

        const formData = new FormData(form);

        submitButton.disabled = true;
        submitButton.textContent = "Uploading...";
        progressWrap.hidden = false;
        progressBar.value = 0;
        progressText.textContent = "Transferring file";
        progressPercent.textContent = "0%";

        const request = new XMLHttpRequest();
        request.open("POST", "/api/upload/upload");
        request.withCredentials = true;
        request.responseType = "text";
        request.timeout = 30 * 60 * 1000;

        request.upload.addEventListener("progress", event => {
            if (!event.lengthComputable) return;

            const percent = Math.round((event.loaded / event.total) * 100);
            progressBar.value = percent;
            progressPercent.textContent = `${percent}%`;
        });

        request.addEventListener("load", () => {
            submitButton.disabled = false;
            submitButton.textContent = "Upload video";

            let result = {};

            try {
                result = JSON.parse(request.responseText);
            } catch {
                result = {};
            }

            if (request.status >= 200 && request.status < 300 && result.stored) {
                progressBar.value = 100;
                progressPercent.textContent = "100%";
                progressText.textContent = "Upload complete";

                showMessage(
                    `Video “${result.title}” uploaded successfully. ID: ${result.id}.`,
                    "success"
                );

                const link = document.createElement("a");
                const params = new URLSearchParams({
                    video: result.id,
                    title: result.title || "",
                    description: result.description || "",
                    tags: Array.isArray(result.tags) ? result.tags.join(" ") : ""
                });

                const watchURL = serviceURL(8080);
                watchURL.search = params.toString();
                link.href = watchURL.href;
                link.textContent = "Watch video";
                link.className = "watch-link";
                feedback.append(document.createElement("br"), link);

                return;
            }

            if (request.status === 401 || request.status === 403) {
                showMessage(
                    "The server rejected the request. Sign in to MicroTube and try again."
                );
                return;
            }

            const detail = result.detail;
            showMessage(
                typeof detail === "string"
                    ? detail
                    : `Could not upload the video (HTTP ${request.status}).`
            );
        });

        request.addEventListener("error", () => {
            submitButton.disabled = false;
            submitButton.textContent = "Upload video";
            showMessage("Could not connect to the upload server.");
        });

        request.addEventListener("timeout", () => {
            submitButton.disabled = false;
            submitButton.textContent = "Upload video";
            showMessage("The request timed out. Check your connection and try again.");
        });

        request.send(formData);
    });
})();
</script>
</body>
</html>
