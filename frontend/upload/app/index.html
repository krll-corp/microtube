<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Upload a video — MicroTube</title>
    <script src="/shared/theme.js?v=2"></script>
    <link rel="stylesheet" href="/shared/base.css?v=4">
    <link rel="stylesheet" href="/shared/upload.css?v=2">
</head>
<body>
<div class="site-shell">
    <header class="site-header">
        <a class="brand" href="/" data-port="8080">microtube</a>
        <nav class="header-actions" aria-label="Navigation">
            <a href="/" data-port="8080">Home</a>
            <a href="/" data-port="8083">Account</a>
            <a href="/" data-port="8081">System status</a>
            <div class="theme-control">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="theme-auto" class="theme-auto" type="button" aria-label="Use system theme" aria-pressed="true">Auto</button>
            </div>
        </nav>
    </header>
    <main class="upload-main">
        <h1>Upload a video</h1>
        <form id="upload-form" method="post" enctype="multipart/form-data" action="/api/upload/upload">
            <div class="dropzone" id="dropzone">
                <button class="button" type="button" id="choose-file">Choose video</button>
                <span class="hint">or drop a file here</span>
                <input id="video-file" name="file" type="file" accept="video/*,.mov,.qt,.mkv,.avi,.m2ts,.mts,.ogv,.vob" hidden>
                <div class="file-info" id="file-info" aria-live="polite" hidden></div>
                <video id="video-preview" class="preview" controls playsinline hidden></video>
            </div>
            <div class="field">
                <label for="thumbnail">Thumbnail (optional)</label>
                <input id="thumbnail" name="thumbnail" type="file" accept="image/jpeg,image/png,image/webp">
            </div>
            <div class="field">
                <label for="title">Video title *</label>
                <input id="title" name="title" type="text" maxlength="200" required>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" maxlength="5000" rows="4"></textarea>
            </div>
            <div class="field">
                <label for="tags">Tags</label>
                <input id="tags" name="tags" type="text" aria-describedby="tags-help">
                <p class="hint" id="tags-help">Separate tags with spaces: nature mountains travel</p>
            </div>
            <div class="progress-wrap" id="progress-wrap" hidden>
                <label class="progress-label" for="progress-bar">
                    <span id="progress-text">Uploading...</span>
                    <span id="progress-percent">0%</span>
                </label>
                <progress id="progress-bar" max="100" value="0"></progress>
            </div>
            <div class="progress-wrap" id="transcode-wrap" hidden>
                <label class="progress-label" for="transcode-bar">
                    <span id="transcode-text">Transcoding video</span>
                    <span id="transcode-percent"></span>
                </label>
                <progress id="transcode-bar" max="100"></progress>
            </div>
            <div id="feedback" class="message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <div class="submit-row">
                <button class="button button-primary" id="submit-button" type="submit">Upload video</button>
            </div>
        </form>
    </main>
</div>
<script>
(() => {
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("video-file");
    const dropzone = document.getElementById("dropzone");
    const fileInfo = document.getElementById("file-info");
    const preview = document.getElementById("video-preview");
    const feedback = document.getElementById("feedback");
    const submitButton = document.getElementById("submit-button");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const progressPercent = document.getElementById("progress-percent");
    const transcodeWrap = document.getElementById("transcode-wrap");
    const transcodeBar = document.getElementById("transcode-bar");
    const transcodeText = document.getElementById("transcode-text");
    const transcodePercent = document.getElementById("transcode-percent");
    const MAX_PART = 8 * 1024 * 1024;
    const MIN_PART = 16 * 1024;

    let previewUrl = null;
    let upload = null;

    function serviceURL(port) {
        if (window.MICROTUBE_URLS) return new URL(window.MICROTUBE_URLS[port], location.href);
        const url = new URL("/", location.href);
        url.port = port;
        return url;
    }

    document.querySelectorAll("[data-port]").forEach(link => {
        link.href = serviceURL(link.dataset.port).href;
    });

    document.getElementById("choose-file").addEventListener("click", () => {
        fileInput.click();
    });

    function formatSize(bytes) {
        if (bytes < 1024 * 1024) {
            return `${(bytes / 1024).toFixed(1)} KB`;
        }

        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function showMessage(message, type = "error") {
        if (type === "error") progressWrap.hidden = transcodeWrap.hidden = true;
        feedback.hidden = false;
        feedback.className = `message ${type}`;
        feedback.textContent = message;
    }

    function clearPreview() {
        fileInput.value = "";
        fileInfo.hidden = true;
        preview.hidden = true;
        preview.removeAttribute("src");
        preview.load();
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
    }

    function isVideo(file) {
        return file?.size && (file.type.startsWith("video/") ||
            /\.(mp4|m4v|mov|qt|mkv|webm|avi|mpg|mpeg|ts|m2ts|mts|flv|wmv|ogv|3gp|vob)$/i.test(file.name));
    }

    function useFile(file) {
        if (!file) return;
        if (!submitButton.disabled) progressWrap.hidden = transcodeWrap.hidden = true;
        upload = null;

        if (!isVideo(file)) {
            clearPreview();
            showMessage("Please choose a video file.");
            return;
        }

        fileInput.files = (() => {
            const transfer = new DataTransfer();
            transfer.items.add(file);
            return transfer.files;
        })();

        fileInfo.hidden = false;
        fileInfo.replaceChildren();

        const name = document.createElement("strong");
        name.textContent = file.name;

        const size = document.createElement("small");
        size.textContent = formatSize(file.size);

        fileInfo.append(name, size);

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);

        preview.src = previewUrl;
        preview.hidden = false;
        feedback.hidden = true;
    }

    fileInput.addEventListener("change", () => {
        useFile(fileInput.files[0]);
    });
    preview.addEventListener("error", () => { preview.hidden = true; });

    ["dragenter", "dragover"].forEach(name => {
        dropzone.addEventListener(name, event => {
            event.preventDefault();
            dropzone.classList.add("dragging");
        });
    });

    ["dragleave", "drop"].forEach(name => {
        dropzone.addEventListener(name, event => {
            event.preventDefault();
            dropzone.classList.remove("dragging");
        });
    });

    dropzone.addEventListener("drop", event => {
        const file = event.dataTransfer.files[0];
        useFile(file);
    });

    form.addEventListener("input", () => { upload = null; });

    function sendUpload(url, body, key, timeout, onProgress) {
        return new Promise((resolve, reject) => {
            const request = new XMLHttpRequest();
            request.open(body === null ? "GET" : "POST", url);
            request.setRequestHeader("Idempotency-Key", key);
            request.withCredentials = true;
            request.responseType = "json";
            request.timeout = timeout;

            if (onProgress) request.upload.onprogress = event => onProgress(event.loaded);
            const interrupted = () => reject(Object.assign(
                new Error("Transfer interrupted. Click Upload video to resume."), {retryable: true}
            ));
            request.onerror = request.ontimeout = request.onabort = interrupted;
            request.onload = () => {
                const {status, response} = request;
                if (status >= 200 && status < 300 && response) {
                    resolve(response);
                    return;
                }
                const message = status === 401 || status === 403
                    ? "Sign in to MicroTube and click Upload video to resume."
                    : typeof response?.detail === "string" ? response.detail : `Upload failed (HTTP ${status}).`;
                reject(Object.assign(new Error(message), {status, retryable: status === 408 || status === 429 || status >= 500}));
            };
            request.send(body);
        });
    }

    function showTranscodeProgress(percent) {
        transcodeWrap.hidden = false;
        transcodeText.textContent = percent === 100 ? "Transcoding complete" : "Transcoding video";
        transcodePercent.textContent = percent === null ? "" : `${percent}%`;
        if (percent === null) transcodeBar.removeAttribute("value");
        else transcodeBar.value = percent;
    }

    async function waitForUpload(result, key) {
        let retries = 0;
        while (result.processing) {
            if (Object.hasOwn(result, "progress")) {
                progressText.textContent = "Transfer complete";
                showTranscodeProgress(result.progress);
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
            try {
                result = await sendUpload("/api/upload/status", null, key, 20_000);
                retries = 0;
            } catch (error) {
                if (!error.retryable || ++retries > 3) throw error;
            }
        }
        if (!transcodeWrap.hidden) showTranscodeProgress(100);
        return result;
    }

    async function sendParts(file, kind, session, progress) {
        let partSize = 1024 * 1024;
        let retries = 0;
        while (session[kind] < file.size) {
            const offset = session[kind];
            const part = file.slice(offset, offset + partSize);
            const started = performance.now();
            let sent = 0;
            try {
                progressText.textContent = "Transferring file";
                const {offset: stored} = await sendUpload(
                    `/api/upload/part?kind=${kind}&offset=${offset}`, part, session.key, 90_000,
                    loaded => { sent = Math.min(part.size, loaded); progress(offset + sent); }
                );
                if (!Number.isSafeInteger(stored) || stored < 0 || stored > file.size || stored === offset) {
                    throw new Error("The server returned an invalid upload position.");
                }
                session[kind] = stored;
                progress(stored);
                if (stored > offset) retries = 0;
                else if (++retries > 3) throw new Error("Upload lost progress. Click Upload video to resume.");
                const elapsed = Math.max(1, performance.now() - started);
                partSize = Math.min(MAX_PART, Math.max(MIN_PART, Math.floor(part.size * 20_000 / elapsed)));
            } catch (error) {
                if (!error.retryable || ++retries > 3) throw error;
                progress(offset);
                progressText.textContent = "Retrying interrupted transfer";
                partSize = Math.max(MIN_PART, Math.floor((sent || part.size) / 2));
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        if (submitButton.disabled) return;
        feedback.hidden = true;

        const file = fileInput.files[0];

        if (!isVideo(file)) {
            showMessage("Choose a video file first.");
            return;
        }

        submitButton.disabled = true;
        upload ??= {
            key: Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join(""),
            video: 0,
            thumbnail: 0,
        };
        const session = upload;
        const formData = new FormData(form);
        const thumbnail = formData.get("thumbnail");
        const thumbnailSize = thumbnail?.size || 0;
        const total = file.size + thumbnailSize;
        formData.delete("file");
        formData.delete("thumbnail");
        formData.set("filename", file.name);
        formData.set("size", String(file.size));
        formData.set("thumbnail_size", String(thumbnailSize));

        submitButton.textContent = "Uploading...";
        progressWrap.hidden = false;
        transcodeWrap.hidden = true;
        progressText.textContent = "Transferring file";

        function progress(loaded) {
            const percent = Math.floor(loaded / total * 100);
            progressBar.value = percent;
            progressPercent.textContent = `${percent}%`;
        }

        try {
            progress(session.video + session.thumbnail);
            await sendParts(file, "video", session, progress);
            if (thumbnailSize) await sendParts(thumbnail, "thumbnail", session, loaded => progress(file.size + loaded));

            progress(total);
            progressText.textContent = "Processing upload";
            const result = await waitForUpload(
                await sendUpload("/api/upload/upload", formData, session.key, 600_000), session.key
            );
            if (!result.stored) throw new Error("The server did not confirm the upload.");
            if (upload === session) {
                form.reset();
                clearPreview();
                upload = null;
            }
            progressText.textContent = "Upload complete";
            showMessage(`Video “${result.title}” uploaded successfully. ID: ${result.id}.`, "success");

            const link = document.createElement("a");
            const watchURL = serviceURL(8080);
            watchURL.search = new URLSearchParams({video: result.id}).toString();
            link.href = watchURL.href;
            link.textContent = "Watch video";
            link.className = "watch-link";
            feedback.append(document.createElement("br"), link);
        } catch (error) {
            if (error.status === 409) session.video = session.thumbnail = 0;
            showMessage(error.message);
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Upload video";
        }
    });
})();
</script>
</body>
</html>
