server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=30s;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location = /_auth_session {
        internal;
        set $auth_backend http://backend-auth:3033/auth/me;
        proxy_pass $auth_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location @sign_in {
        add_header Cache-Control "private, no-store" always;
        return 302 $scheme://$host:8083/;
    }

    location /shared/ {
        try_files $uri =404;
    }

    location /api/upload/ {
        client_max_body_size 0;
        set $upload_backend http://backend-upload:3032;

        rewrite ^/api/upload/(.*)$ /$1 break;

        proxy_pass $upload_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /_auth_session;
        error_page 401 = @sign_in;
        add_header Cache-Control "private, no-store" always;
        try_files $uri /index.html =404;
    }
}
