server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location ^~ /hls/ {
        alias /videos/.hls/;
        disable_symlinks on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4;
            video/iso.segment m4s;
        }
        add_header Cache-Control "public, max-age=3600";
    }

    location /vendor/ {
        try_files $uri =404;
    }

    location = /api/auth/me {
        set $auth_backend http://backend-auth:3033/auth/me;
        proxy_pass $auth_backend;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "private, no-store" always;
    }

    location /api/video/ {
        set $video_backend http://backend-video:3030;
        rewrite ^/api/video/(.*)$ /$1 break;
        proxy_pass $video_backend;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /api/search {
        set $text_backend http://backend-text:3031;
        rewrite ^ /search break;
        proxy_pass $text_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 610s;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
