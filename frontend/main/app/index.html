<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="MicroTube — watch and publish videos">
    <title>MicroTube</title>
    <script src="/shared/theme.js?v=2"></script>
    <link rel="stylesheet" href="/shared/base.css?v=4">
    <link rel="stylesheet" href="/shared/main.css">
    <script defer src="/app.js?v=2"></script>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="/" aria-label="MicroTube — home">microtube</a>
            <form class="search-form" id="search-form" role="search">
                <button type="submit" aria-label="Find videos">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
                </button>
                <input id="global-search" name="search" type="search" placeholder="Search videos" aria-label="Search videos">
            </form>
            <nav class="header-actions" aria-label="Account">
                <a id="upload-link" href="http://localhost:8082/">Upload</a>
                <a id="account-link" href="http://localhost:8083/">Account</a>
                <div class="theme-control">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="theme-auto" class="theme-auto" type="button" aria-label="Use system theme" aria-pressed="true">Auto</button>
                </div>
            </nav>
        </header>
        <main id="app-main"><p>Loading…</p></main>
        <footer class="catalog-footer">
            <span>Demo catalog · local search</span>
            <a id="status-link" href="http://localhost:8081/">System status</a>
        </footer>
    </div>
</body>
</html>
