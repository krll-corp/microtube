<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="MicroTube — watch and publish videos">
    <title>MicroTube</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/shared/main.css">
    <script defer src="/app.js?v=2"></script>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="/" aria-label="MicroTube — home">microtube</a>
            <form class="search-form" id="search-form" role="search">
                <button type="submit" aria-label="Find videos">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
                </button>
                <input id="global-search" name="search" type="search" placeholder="Search videos" aria-label="Search videos">
            </form>
            <nav class="header-actions" aria-label="Account">
                <a id="upload-link" href="http://localhost:8082/">Upload</a>
                <a id="account-link" href="http://localhost:8083/">Account</a>
            </nav>
        </header>
        <main id="app-main"><p>Loading…</p></main>
        <footer class="catalog-footer">
            <span>Demo catalog · local search</span>
            <a id="status-link" href="http://localhost:8081/">System status</a>
        </footer>
    </div>
</body>
</html>
