server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=30s;

    location = /checks/monitor {
        default_type text/plain;
        return 200 "ok";
    }

    location = /checks/main {
        set $target http://frontend-main/;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/auth-ui {
        set $target http://frontend-auth/;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/upload-ui {
        set $target http://frontend-upload/;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/auth-api {
        set $target http://backend-auth:3033/health;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/video-api {
        set $target http://backend-video:3030/videos;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/upload-api {
        set $target http://backend-upload:3032/docs;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/text-api {
        set $target http://backend-text:3031/health;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/ai-video {
        set $target http://backend-ai-video:4001/openapi.json;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /checks/ai-text {
        set $target http://backend-ai-text:4001/openapi.json;
        proxy_pass $target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}