name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [db, backend, frontend]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Check source syntax
        run: |
          python -m compileall -q backend tests
          find frontend -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Install deps
        if: matrix.suite == 'frontend'
        run: |
          python -m pip install -r tests/requirements.frontend.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Run Compose integration tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: python tests/general-tests.py "$TEST_SUITE"