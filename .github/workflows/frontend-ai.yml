name: Frontend with Copilot

on:
  workflow_dispatch:

jobs:
  frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install browser and Copilot CLI
        run: |
          python -m pip install -r tests/requirements.frontend.txt
          python -m playwright install --with-deps --only-shell chromium
          npm install --global @github/copilot@1.0.112
      - name: Run frontend tests with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: python tests/general-tests.py frontend
