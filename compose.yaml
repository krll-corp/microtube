name: microtube

services:
  frontend-main:
    build:
      context: ./frontend/main
      dockerfile: dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend-upload:
    build:
      context: ./frontend/upload
      dockerfile: dockerfile
    environment:
      UPLOAD_API_PORT: ${UPLOAD_API_PORT:-3032}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UPLOAD_PORT:-8082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend-monitor:
    build:
      context: ./frontend/monitor
      dockerfile: dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend-video:
    build:
      context: ./backend/video
      dockerfile: dockerfile
    environment:
      VIDEO_STORAGE_DIR: /videos
      VIDEO_CACHE_MB: ${VIDEO_CACHE_MB:-64}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - videos:/videos:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VIDEO_API_PORT:-3030}:3030"
    depends_on:
      db-videos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3030/videos', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend-text:
    build:
      context: ./backend/text
      dockerfile: dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TEXT_API_PORT:-3031}:3031"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3031/', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend-upload:
    build:
      context: ./backend/upload
      dockerfile: dockerfile
    depends_on:
      db-videos:
        condition: service_healthy
    volumes:
      - videos:/videos
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UPLOAD_API_PORT:-3032}:3032"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3032/docs', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend-indexing:
    build:
      context: ./backend/indexing
      dockerfile: dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db-videos:
        condition: service_healthy
      backend-ai-video:
        condition: service_healthy
      backend-ai-text:
        condition: service_healthy
    restart: unless-stopped

  backend-ai-video:
    build:
      context: ./backend/ai/video
      dockerfile: dockerfile
    environment:
      VIDEO_STORAGE_DIR: /videos
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - videos:/videos:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VIDEO_AI_PORT:-4001}:4001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/openapi.json', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10m

  backend-ai-text:
    build:
      context: ./backend/ai/text
      dockerfile: dockerfile
    environment:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TEXT_AI_PORT:-4002}:4001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/openapi.json', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10m

  db-videos:
    build:
      context: ./db/videos
      dockerfile: dockerfile
    environment:
      POSTGRES_DB: videos
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - videos-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-users:
    build:
      context: ./db/users
      dockerfile: dockerfile
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - users-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

#reuse just in case
volumes:
  videos-db:
    name: microtube-videos-db
  users-db:
    name: microtube-users-db
  videos:
    name: microtube-videos
  hf-cache:
    name: microtube-hf-cache
